# Builds the Jekyll blog in blog/ and deploys it to GitHub Pages.
# Requires Pages to be enabled with source "GitHub Actions" (repo Settings →
# Pages). The site is served at https://hsliuustc0106.github.io/vllm-omni-cookbook/

name: Deploy blog to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "blog/**"
      - ".github/workflows/blog-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./blog
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
