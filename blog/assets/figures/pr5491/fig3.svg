<svg width="1060" height="240" viewBox="0 0 1060 240" role="img" aria-label="Paged KV block residency and pruning" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1060" height="240" fill="#0e141c"/>
    <defs>
      <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
    </defs>
    <!-- block strip -->
    <g>
      <text x="70" y="60" font-size="12.5" fill="#8b98a9">blocks over session history (1 block = 1 chunk = 3 latent frames):</text>
      <rect x="70" y="76" width="180" height="46" rx="6" fill="#2a1f4d" stroke="#6d28d9"/><text x="160" y="98" font-size="13" fill="#c4b5fd" text-anchor="middle" class="mono">SINK · 9 chunks</text><text x="160" y="114" font-size="11" fill="#8b98a9" text-anchor="middle">never evicted</text>
      <rect x="252" y="76" width="330" height="46" rx="6" fill="#121821" stroke="#374151" stroke-dasharray="5 4"/><text x="417" y="98" font-size="13" fill="#5c6a7d" text-anchor="middle" class="mono">middle history · pruned post-commit</text><text x="417" y="114" font-size="11" fill="#5c6a7d" text-anchor="middle">freed to the block pool exactly once (null-block guard)</text>
      <rect x="584" y="76" width="250" height="46" rx="6" fill="#2a1f4d" stroke="#6d28d9"/><text x="709" y="98" font-size="13" fill="#c4b5fd" text-anchor="middle" class="mono">RECENT WINDOW · 18 chunks</text><text x="709" y="114" font-size="11" fill="#8b98a9" text-anchor="middle">sliding</text>
      <rect x="836" y="76" width="120" height="46" rx="6" fill="#0f1f16" stroke="#4ade80"/><text x="896" y="98" font-size="13" fill="#4ade80" text-anchor="middle" class="mono">current · 3</text><text x="896" y="114" font-size="11" fill="#8b98a9" text-anchor="middle">in-flight commit</text>
      <path d="M 900 66 L 900 46 L 896 40" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
    </g>
    <!-- prune arrow -->
    <line x1="417" y1="126" x2="417" y2="160" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrP)"/>
    <text x="432" y="150" font-size="11.5" fill="#a78bfa">skip = floor((N − sink − window)/chunk) · snapped to chunk multiples</text>
    <!-- facts under strip -->
    <g font-size="12.5" fill="#8b98a9">
      <text x="70" y="196" class="mono"><tspan fill="#c4b5fd">resident/session = sink + window (+1 in-flight)</tspan> · capacity = KV budget ÷ per-session bytes</text>
      <text x="70" y="214" class="mono">effective = max(configured, required(1)) · LRU eviction at capacity</text>
      <text x="70" y="232">prompt switch clears text cross-attn only, self-attention history survives · probes write to scratch, only the clean final pass commits</text>
    </g>
  </svg>