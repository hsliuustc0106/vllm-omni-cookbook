<svg xmlns='http://www.w3.org/2000/svg' width='1240' height='720' viewBox='0 0 1240 720' font-family='-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif'><defs>
<marker id="arrow" markerWidth="9" markerHeight="8" refX="7.5" refY="4" orient="auto">
  <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
</marker>
<marker id="arrowP" markerWidth="9" markerHeight="8" refX="7.5" refY="4" orient="auto">
  <path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/>
</marker>
<marker id="arrowT" markerWidth="9" markerHeight="8" refX="7.5" refY="4" orient="auto">
  <path d="M0,0 L8,4 L0,8 z" fill="#0d9488"/>
</marker>
<linearGradient id="gradB" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#d97706"/><stop offset="1" stop-color="#7c3aed"/>
</linearGradient>
</defs><rect width='1240' height='720' fill='#ffffff'/><text x='48' y='56' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='21' fill='#111827' text-anchor='start' font-weight='bold'>Where the memory actually goes</text><text x='48' y='82' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='13.5' fill='#6b7280' text-anchor='start' font-weight='normal'>Schematic VRAM timeline of an online-FP8 startup (not to scale). The BF16 copy is transient; only FP8 weights stay resident.</text><line x1='96' y1='300' x2='96' y2='20' stroke='#d8dee4' stroke-width='1.4'/><line x1='96' y1='300' x2='1096' y2='300' stroke='#d8dee4' stroke-width='1.4'/><line x1='96' y1='64' x2='1096' y2='64' stroke='#d97706' stroke-width='1.8' stroke-dasharray='7 6'/><text x='1092' y='54' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='12' fill='#d97706' text-anchor='end' font-weight='bold'>BF16 serving — weights stay 2 bytes each</text><path d='M 96,300 L 136,310.2 L 176,320.4 L 216,330.5 L 256,340.7 L 296,350.9 L 336,361.1 L 376,371.3 L 416,381.5 L 456,391.6 L 496,401.8 L 536,412.0 L 556,188 L 1096,188 L 1096,300 Z' fill='#f3eefe' stroke='#7c3aed' stroke-width='2'/><text x='286' y='242' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='12' fill='#5b21b6' text-anchor='start' font-weight='bold'>quantized layers accumulate  ≈ ½ weight bytes</text><path d='M 96,300 L 114.0,264.2 L 136,310.2 L 154.0,274.4 L 176,320.4 L 194.0,284.5 L 216,330.5 L 234.0,294.7 L 256,340.7 L 274.0,304.9 L 296,350.9 L 314.0,315.1 L 336,361.1 L 354.0,325.3 L 376,371.3 L 394.0,335.5 L 416,381.5 L 434.0,345.6 L 456,391.6 L 474.0,355.8 L 496,401.8 L 514.0,366.0 L 536,412.0 ' fill='none' stroke='#d97706' stroke-width='1.6' opacity='0.9'/><text x='396' y='124' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='11' fill='#d97706' text-anchor='start' font-weight='normal'>one BF16 layer, transient</text><line x1='452' y1='137' x2='396' y2='182' stroke='#d97706' stroke-width='1.2' marker-end='url(#arrow)'/><rect x='556' y='132' width='540' height='56' fill='#e6f5f3' stroke='#a8d8d2'/><text x='568' y='154' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='11' fill='#065f46' text-anchor='start' font-weight='normal'>activations, attention workspace,</text><text x='568' y='170' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='11' fill='#065f46' text-anchor='start' font-weight='normal'>VAE / text encoder — quantize-aware only</text><line x1='556' y1='20' x2='556' y2='300' stroke='#111827' stroke-width='1.4' stroke-dasharray='4 4'/><text x='556' y='324' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='11.5' fill='#111827' text-anchor='middle' font-weight='bold'>load done · empty_cache()</text><text x='556' y='342' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>transient BF16 storages released</text><text x='504' y='48' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='12' fill='#111827' text-anchor='start' font-weight='bold'>startup peak ≈ FP8-so-far + one BF16 layer + scales</text><line x1='654' y1='56' x2='492' y2='104' stroke='#111827' stroke-width='1.3' marker-end='url(#arrow)'/><text x='586' y='168' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='12' fill='#5b21b6' text-anchor='start' font-weight='bold'>steady state: FP8 weights ≈ ½ bytes, frozen</text><text x='586' y='186' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal'>scales; peak VRAM also carries activations</text><text x='596.0' y='370' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal'>time  →   (download / mmap → layerwise load → serve)</text><text x='60' y='160.0' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='12' fill='#6b7280' text-anchor='middle' font-weight='normal' transform='rotate(-90 60 160)'>device memory</text><rect x='48' y='560' width='562.0' height='96' rx='12' fill='#f6f8fa' stroke='#d8dee4' stroke-width='1'/><text x='70' y='588' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='12.5' fill='#111827' text-anchor='start' font-weight='bold'>weights: 2 B → 1 B per element on every quantized</text><text x='70' y='608' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal'>linear — the deterministic saving; norms, modulation,</text><text x='70' y='626' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal'>ignored_layers and non-quantized components stay BF16.</text><text x='70' y='644' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='11' fill='#9ca3af' text-anchor='start' font-weight='normal'>measured: Qwen-Image-2512 peak 99.0 → 85.8 GiB (FP8, recipe)</text><rect x='630.0' y='560' width='562.0' height='96' rx='12' fill='#fffdf8' stroke='#f0cd9a' stroke-width='1' stroke-dasharray='6 4'/><text x='652.0' y='588' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='12.5' fill='#92400e' text-anchor='start' font-weight='bold'>disk + startup: the BF16 checkpoint stays local</text><text x='652.0' y='608' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal'>and re-quantizes on every boot — that is the price of</text><text x='652.0' y='626' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal'>skipping the offline step; serialize or buy a ModelOpt</text><text x='652.0' y='644' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal'>checkpoint if disk/load-time matters more than VRAM.</text></svg>