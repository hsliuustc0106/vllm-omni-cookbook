<svg xmlns='http://www.w3.org/2000/svg' width='1240' height='700' viewBox='0 0 1240 700' font-family='-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif'><defs>
<marker id="arrow" markerWidth="9" markerHeight="8" refX="7.5" refY="4" orient="auto">
  <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
</marker>
<marker id="arrowP" markerWidth="9" markerHeight="8" refX="7.5" refY="4" orient="auto">
  <path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/>
</marker>
<marker id="arrowT" markerWidth="9" markerHeight="8" refX="7.5" refY="4" orient="auto">
  <path d="M0,0 L8,4 L0,8 z" fill="#0d9488"/>
</marker>
<linearGradient id="gradB" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#d97706"/><stop offset="1" stop-color="#7c3aed"/>
</linearGradient>
</defs><rect width='1240' height='700' fill='#ffffff'/><text x='48' y='56' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='21' fill='#111827' text-anchor='start' font-weight='bold'>Two scales, two lifetimes</text><text x='48' y='82' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='13.5' fill='#6b7280' text-anchor='start' font-weight='normal'>FP8 GEMMs dequantize in the epilogue using one frozen weight scale and one per-batch activation scale.</text><rect x='48' y='112' width='538' height='380' rx='14' fill='#ffffff' stroke='#f0cd9a' stroke-width='1.4'/><path d='M 48,138 a 14,14 0 0 1 14,-14 h 510 a 14,14 0 0 1 14,14 v 10 h -538 z' fill='#fdf3e3'/><text x='66' y='138' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='12.5' fill='#d97706' text-anchor='start' font-weight='bold'>WEIGHT SCALE — computed once at load</text><rect x='654' y='112' width='538' height='380' rx='14' fill='#ffffff' stroke='#a8d8d2' stroke-width='1.4'/><path d='M 654,138 a 14,14 0 0 1 14,-14 h 510 a 14,14 0 0 1 14,14 v 10 h -538 z' fill='#e6f5f3'/><text x='672' y='138' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='12.5' fill='#0d9488' text-anchor='start' font-weight='bold'>ACTIVATION SCALE — recomputed every forward</text><rect x='76' y='178' width='200' height='54' rx='9' fill='#fdf3e3' stroke='#f0cd9a' stroke-width='1'/><text x='176' y='201' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='14' fill='#111827' text-anchor='middle' font-weight='bold'>W (BF16)</text><text x='176' y='220' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>2 bytes / element</text><line x1='280' y1='205' x2='348' y2='205' stroke='#d97706' stroke-width='1.6' marker-end='url(#arrow)'/><text x='314' y='196' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='10.5' fill='#d97706' text-anchor='middle' font-weight='normal'>quantize</text><text x='314' y='218' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='10.5' fill='#9ca3af' text-anchor='middle' font-weight='normal'>at load</text><rect x='354' y='174' width='204' height='62' rx='9' fill='#f3eefe' stroke='#c4b0f0' stroke-width='1'/><text x='456' y='197' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='14' fill='#4c1d95' text-anchor='middle' font-weight='bold'>W₈  +  s_w</text><text x='456' y='220' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='10.5' fill='#6d28d9' text-anchor='middle' font-weight='normal'>1 byte / element + scale</text><rect x='76' y='270' width='482' height='74' rx='9' fill='#f6f8fa' stroke='#d8dee4' stroke-width='1'/><text x='92' y='296' font-family="Menlo, Monaco, monospace" font-size='12.5' fill='#111827' text-anchor='start' font-weight='normal'>per-tensor:   s_w = max|W| / 448</text><text x='92' y='318' font-family="Menlo, Monaco, monospace" font-size='12.5' fill='#6b7280' text-anchor='start' font-weight='normal'>per-block:   s_w per 128×128 tile (weight_block_size)</text><text x='92' y='336' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='10.5' fill='#9ca3af' text-anchor='start' font-weight='normal'>448 = E4M3&#x27;s largest normal value</text><rect x='76' y='368' width='228.0' height='21.5' rx='10.75' fill='#f3eefe' stroke='#c4b0f0' stroke-width='1'/><text x='190.0' y='382.53' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='10.5' fill='#111827' text-anchor='middle' font-weight='bold'>frozen after process_weights_after_loading</text><text x='76' y='414' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='11.5' fill='#6b7280' text-anchor='start' font-weight='normal'>deterministic across steps — same scale for every request,</text><text x='76' y='432' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='11.5' fill='#6b7280' text-anchor='start' font-weight='normal'>same scale at t = T and t = 0</text><text x='76' y='474' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='11.5' fill='#6b7280' text-anchor='start' font-weight='normal'>no calibration data needed — the scale comes from</text><text x='76' y='492' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='11.5' fill='#6b7280' text-anchor='start' font-weight='normal'>the weight tensor&#x27;s own range</text><circle cx='784' cy='248' r='58' fill='#e6f5f3' stroke='#a8d8d2' stroke-width='1.4'/><text x='784' y='242' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='12' fill='#111827' text-anchor='middle' font-weight='bold'>denoise loop</text><text x='784' y='262' font-family="Menlo, Monaco, monospace" font-size='12' fill='#0d9488' text-anchor='middle' font-weight='normal'>t = T … 0</text><path d='M 723,213 A 70,70 0 0 1 845,213' fill='none' stroke='#0d9488' stroke-width='2' marker-end='url(#arrowT)'/><path d='M 845,283 A 70,70 0 0 1 723,283' fill='none' stroke='#0d9488' stroke-width='2' marker-end='url(#arrowT)'/><line x1='864' y1='248' x2='922' y2='248' stroke='#0d9488' stroke-width='1.6' marker-end='url(#arrow)'/><rect x='928' y='202' width='236' height='92' rx='9' fill='#ffffff' stroke='#a8d8d2' stroke-width='1'/><text x='1046' y='228' font-family="Menlo, Monaco, monospace" font-size='13.5' fill='#065f46' text-anchor='middle' font-weight='bold'>x_t → a₈, sₐ</text><text x='1046' y='252' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal'>amax over the batch,</text><text x='1046' y='270' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal'>recomputed each step</text><rect x='682' y='330' width='482' height='96' rx='9' fill='#fffdf8' stroke='#f0cd9a' stroke-width='1' stroke-dasharray='6 4'/><text x='698' y='354' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='12' fill='#92400e' text-anchor='start' font-weight='bold'>why dynamic: latent ranges shift across</text><text x='698' y='373' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal'>timesteps, so a static activation scale</text><text x='698' y='392' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal'>calibrated once would clip or waste range.</text><text x='698' y='414' font-family="Menlo, Monaco, monospace" font-size='10.5' fill='#9ca3af' text-anchor='start' font-weight='normal'>(activation_scheme=&quot;static&quot; needs checkpoint scales)</text><text x='682' y='456' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='11.5' fill='#6b7280' text-anchor='start' font-weight='normal'>cost: one amax reduction per GEMM input —</text><text x='682' y='474' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='11.5' fill='#6b7280' text-anchor='start' font-weight='normal'>the price of skipping calibration entirely.</text><rect x='48' y='522' width='1144' height='66' rx='12' fill='#f8f7ff' stroke='#c4b0f0' stroke-width='1'/><text x='620.0' y='550' font-family="Menlo, Monaco, monospace" font-size='19' fill='#4c1d95' text-anchor='middle' font-weight='bold'>y  =  ( a₈  @  W₈ᵀ )  ·  sₐ  ·  s_w  +  b</text><text x='620.0' y='574' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>FP8 tensor-core GEMM (truncated products) · scales applied in the epilogue</text><text x='48' y='676' font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size='11' fill='#9ca3af' text-anchor='start' font-weight='normal'>quality lever: ignored_layers removes a linear from this scheme entirely</text></svg>