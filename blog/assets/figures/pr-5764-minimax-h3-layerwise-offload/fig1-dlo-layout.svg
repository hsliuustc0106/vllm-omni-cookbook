<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Distributed layerwise offload for MiniMax-H3 — 2 × workstation GPUs (PR #5764)</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#475569">weights live on the host; each GPU keeps a few resident DiT blocks and streams the rest one block at a time</text>

  <!-- Host column -->
  <rect x="40" y="80" width="250" height="290" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="165" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Host: pinned CPU memory</text>
  <text x="165" y="120" text-anchor="middle" font-size="11" fill="#475569">rank-local shard (no full copy per rank)</text>

  <rect x="60" y="135" width="210" height="80" rx="6" fill="#ffffff" stroke="#0284c7"/>
  <text x="165" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#0284c7">DiT weight shard</text>
  <text x="165" y="177" text-anchor="middle" font-size="11" fill="#475569">TP slice of the 66.3 GB DiT</text>
  <text x="165" y="193" text-anchor="middle" font-size="11" fill="#475569">streamed block by block</text>

  <rect x="60" y="228" width="210" height="60" rx="6" fill="#ffffff" stroke="#7c3aed"/>
  <text x="165" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#7c3aed">Text-encoder blocks</text>
  <text x="165" y="266" text-anchor="middle" font-size="11" fill="#475569">51.5 GB encoder, staged on use</text>

  <rect x="60" y="300" width="210" height="55" rx="6" fill="#ffffff" stroke="#7c3aed"/>
  <text x="165" y="321" text-anchor="middle" font-size="12" font-weight="600" fill="#7c3aed">VAE decoder blocks</text>
  <text x="165" y="337" text-anchor="middle" font-size="11" fill="#475569">executable blocks staged on use</text>

  <text x="165" y="383" text-anchor="middle" font-size="11" fill="#475569">200 GiB+ system RAM</text>
  <text x="165" y="399" text-anchor="middle" font-size="11" fill="#475569">(384 GiB recommended)</text>

  <!-- Arrows host -> GPUs -->
  <path d="M 300 215 C 380 215, 420 180, 480 175" fill="none" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 300 245 C 400 260, 470 290, 545 300" fill="none" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="150" text-anchor="middle" font-size="11" fill="#0891b2">H2D copy stream</text>
  <text x="420" y="166" text-anchor="middle" font-size="11" fill="#0891b2">--dlo-no-use-allgather</text>

  <!-- GPU 0 -->
  <rect x="490" y="80" width="200" height="290" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="590" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">GPU 0</text>
  <text x="590" y="120" text-anchor="middle" font-size="11" fill="#475569">32 GiB HBM (RTX 5090)</text>

  <rect x="505" y="135" width="170" height="74" rx="6" fill="#cffafe" stroke="#0284c7"/>
  <text x="590" y="158" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">N resident DiT blocks</text>
  <text x="590" y="175" text-anchor="middle" font-size="11" fill="#475569">20 on 2×32 GB · 12 on 24 GB</text>
  <text x="590" y="191" text-anchor="middle" font-size="11" fill="#475569">stay on device all request</text>

  <rect x="505" y="222" width="170" height="74" rx="6" fill="#ffffff" stroke="#0284c7" stroke-dasharray="5 4"/>
  <text x="590" y="245" text-anchor="middle" font-size="12" font-weight="600" fill="#0284c7">2 rotating stream slots</text>
  <text x="590" y="262" text-anchor="middle" font-size="11" fill="#475569">double buffer: compute k,</text>
  <text x="590" y="278" text-anchor="middle" font-size="11" fill="#475569">prefetch k+1</text>

  <rect x="505" y="308" width="170" height="47" rx="6" fill="#ffffff" stroke="#7c3aed"/>
  <text x="590" y="327" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">encoders + VAE tiling</text>
  <text x="590" y="343" text-anchor="middle" font-size="11" fill="#475569">H3 encoders stay resident</text>

  <!-- GPU 1 -->
  <rect x="710" y="80" width="200" height="290" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="810" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">GPU 1</text>
  <text x="810" y="120" text-anchor="middle" font-size="11" fill="#475569">32 GiB HBM (RTX 5090)</text>

  <rect x="725" y="135" width="170" height="74" rx="6" fill="#cffafe" stroke="#0284c7"/>
  <text x="810" y="158" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">N resident DiT blocks</text>
  <text x="810" y="175" text-anchor="middle" font-size="11" fill="#475569">mirror of GPU 0</text>
  <text x="810" y="191" text-anchor="middle" font-size="11" fill="#475569">(leading blocks only)</text>

  <rect x="725" y="222" width="170" height="74" rx="6" fill="#ffffff" stroke="#0284c7" stroke-dasharray="5 4"/>
  <text x="810" y="245" text-anchor="middle" font-size="12" font-weight="600" fill="#0284c7">2 rotating stream slots</text>
  <text x="810" y="262" text-anchor="middle" font-size="11" fill="#475569">same block order,</text>
  <text x="810" y="278" text-anchor="middle" font-size="11" fill="#475569">own TP shard</text>

  <rect x="725" y="308" width="170" height="47" rx="6" fill="#ffffff" stroke="#7c3aed"/>
  <text x="810" y="327" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">VAE patch parallelism</text>
  <text x="810" y="343" text-anchor="middle" font-size="11" fill="#475569">tile decode on both GPUs</text>

  <!-- bottom capacity strip -->
  <rect x="40" y="400" width="870" height="50" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="475" y="421" text-anchor="middle" font-size="12" fill="#0f172a">66.3 GB DiT + 51.5 GB Qwen3-VL encoder + video/audio VAEs ≈ 120 GB of weights</text>
  <text x="475" y="439" text-anchor="middle" font-size="12" fill="#475569">resident or pure-Ulysses paths cannot fit it on two 24–32 GB workstation GPUs — DLO trades bandwidth for capacity</text>
</svg>
