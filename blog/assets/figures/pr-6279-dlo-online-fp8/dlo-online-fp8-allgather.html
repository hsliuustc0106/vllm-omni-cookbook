.form-switch .form-check-input:disabled,

.form-switch .form-check-input:checked {

.form-switch .form-check-input:checked::before {

.form-range::-moz-range-track {

&lt;div id=&quot;dlo-online-fp8-allgather&quot; class=&quot;dlo-viz&quot; role=&quot;region&quot; aria-label=&quot;DLO AllGather with online FP8&quot;&gt;
  &lt;style&gt;
    #dlo-online-fp8-allgather {

    #dlo-online-fp8-allgather .dlo-node {

    }

    #dlo-online-fp8-allgather .dlo-node.transfer {
      border-left-color: var(--dlo-transfer);
      background: color-mix(in srgb, var(--dlo-transfer) 13%, transparent);
    }

    #dlo-online-fp8-allgather .dlo-node.collective {
      border-left-color: var(--dlo-collective);
      background: color-mix(in srgb, var(--dlo-collective) 13%, transparent);

    #dlo-online-fp8-allgather .dlo-node.compute {

    #dlo-online-fp8-allgather .dlo-node.ddr {

    #dlo-online-fp8-allgather .dlo-arrow {

    #dlo-online-fp8-allgather .dlo-rank.active {

    #dlo-online-fp8-allgather .dlo-rank-name { font-weight: 500; }
    #dlo-online-fp8-allgather .dlo-rank-meta { color: var(--dlo-muted); font-size: .78rem; margin-top: 2px; }
    #dlo-online-fp8-allgather .dlo-rank-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-top: 8px;
      font-size: .8rem;

    #dlo-online-fp8-allgather .dlo-chip {

    #dlo-online-fp8-allgather .dlo-chip.slot0 { border-color: var(--dlo-compute); }

    #dlo-online-fp8-allgather .dlo-tick {

    #dlo-online-fp8-allgather .dlo-note { margin-top: 10px; min-height: 2.7em; }

    #dlo-online-fp8-allgather .dlo-legend {

    #dlo-online-fp8-allgather .dlo-legend span::before {

    #dlo-online-fp8-allgather .legend-host { color: var(--dlo-host); }

    #dlo-online-fp8-allgather .legend-compute { color: var(--dlo-compute); }
    #dlo-online-fp8-allgather .legend-disk { color: var(--dlo-disk); }
    #dlo-online-fp8-allgather .legend-ddr { color: var(--dlo-ddr); }

  &lt;script&gt;
    (() =&gt; {

      const note = root.querySelector(&quot;#dlo-note&quot;);

      const stages = [
        {
          title: &quot;Source and quantization&quot;,
          source: &quot;BF16 checkpoint file&quot;,
          shard: &quot;Read pages / temporary BF16 staging&quot;,
          gpu: &quot;No full layer resident yet&quot;,
          next: &quot;&quot;,
          note: &quot;The persistent BF16 source stays on disk. The loader reads pages into host DDR or may materialize a temporary tensor on HBM; this is not the DLO runtime payload.&quot;
        },
        {
          title: &quot;Quantize, then shard&quot;,
          source: &quot;Temporary BF16 staging released&quot;,
          shard: &quot;FP8 weight + scale; each rank keeps 1 / DP-size&quot;,
          gpu: &quot;Two reusable device slots reserved&quot;,
          next: &quot;Two reusable device slots&quot;,
          note: &quot;After online quantization, the BF16 staging tensor can be released. DLO shards the finalized FP8 runtime tensor and its scale; for DP2 this is 1/2 per rank, and for DP4 it is 1/4.&quot;
        },
        {
          title: &quot;H2D copy on the copy stream&quot;,
          source: &quot;FP8 host shard N+1&quot;,
          shard: &quot;H2D FP8 shard N+1&quot;,
          gpu: &quot;Slot 1 receives FP8 bytes&quot;,
          next: &quot;Slot 0 computes FP8 layer N&quot;,
          note: &quot;Only the finalized FP8 payload is copied into the next device slot. The copy stream runs asynchronously with the current compute stream.&quot;
        },
        {
          title: &quot;AllGather on the communication stream&quot;,
          source: &quot;All rank-local FP8 shards&quot;,
          shard: &quot;NCCL/HCCL AllGather: FP8 + scale&quot;,
          gpu: &quot;Full FP8 layer N+1 reconstructed&quot;,
          next: &quot;Slot 0 remains independent&quot;,
          note: &quot;AllGather concatenates equal-sized FP8 rank shards and reconstructs the scale metadata in the shared output buffer. It synchronizes weights, not request data.&quot;
        },
        {
          title: &quot;Compute the current block&quot;,
          source: &quot;FP8 host shard N+2&quot;,
          shard: &quot;Prefetch FP8 continues&quot;,
          gpu: &quot;Slot 0: full FP8 block N&quot;,
          next: &quot;Slot 1: full FP8 block N+1&quot;,
          note: &quot;The compute stream reads one reconstructed FP8 layer while H2D and AllGather prepare the other slot. BF16 is not part of this transfer path.&quot;
        },
        {
          title: &quot;Post-forward release&quot;,
          source: &quot;FP8 host shards stay resident&quot;,
          shard: &quot;No D2H copy&quot;,
          gpu: &quot;Release FP8 slot 0&quot;,
          next: &quot;Slot 1 stays ready&quot;,
          note: &quot;After the block finishes, DLO replaces its device storage with a placeholder. The host shard is immutable and remains available for the next request.&quot;
        },
        {
          title: &quot;Repeat around the ring&quot;,
          source: &quot;Next FP8 block shard&quot;,
          shard: &quot;FP8 H2D → AllGather → slot&quot;,
          gpu: &quot;Compute FP8 N+1, prefetch N+2&quot;,
          next: &quot;Exactly two slots reused&quot;,
          note: &quot;The circular hook chain repeats this pipeline for every DiT block, keeping the device weight bound at two shared buffers.&quot;
        }
      ];

      const layouts = {
        dp2: { label: &quot;DP2 / SP2&quot;, dp: 2, usp: 2, groups: &quot;two DP groups of two ranks&quot;, concurrency: &quot;up to 2 requests per wave&quot; },
        dp4: { label: &quot;DP4 / SP1&quot;, dp: 4, usp: 1, groups: &quot;one DP group of four ranks&quot;, concurrency: &quot;up to 4 requests per wave&quot; }
      };

      let currentStep = 0;
      let timer = null;

      function rankCards(layout, stage) {
        const cards = [];
        for (let index = 0; index &lt; 4; index += 1) {
          const group = layout.dp === 4 ? &quot;DP group 0&quot; : `DP group ${Math.floor(index / 2)}`;
          const active = stage &gt;= 2 &amp;&amp; stage &lt;= 5;
          const phase = stage &lt; 2 ? &quot;waiting&quot; : stage === 2 ? &quot;H2D shard&quot; : stage === 3 ? &quot;AllGather&quot; : &quot;ready / compute&quot;;
          cards.push(`&lt;div class=&quot;dlo-rank${active ? &quot; active&quot; : &quot;&quot;}&quot;&gt;
            &lt;div class=&quot;dlo-rank-name&quot;&gt;Rank ${index}&lt;/div&gt;
            &lt;div class=&quot;dlo-rank-meta&quot;&gt;${group} · ${phase}&lt;/div&gt;
            &lt;div class=&quot;dlo-rank-row&quot;&gt;&lt;span&gt;input&lt;/span&gt;&lt;span class=&quot;dlo-chip&quot;&gt;shard ${index % layout.dp + 1}/${layout.dp}&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;dlo-rank-row&quot;&gt;&lt;span&gt;collective&lt;/span&gt;&lt;span class=&quot;dlo-chip&quot;&gt;${stage &gt;= 3 ? &quot;full layer&quot; : &quot;pending&quot;}&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;`);
        }
        return cards.join(&quot;&quot;);
      }

      function render() {
        const layout = layouts[configSelect.value];
        const stage = stages[currentStep];
        stepNumber.textContent = `${currentStep + 1} / ${stages.length}`;
        stageTitle.textContent = `${stage.title} · ${layout.label}`;
        source.className = `dlo-node${currentStep === 0 ? &quot; disk&quot; : &quot;&quot;}`;
        source.innerHTML = `&lt;strong&gt;${stage.source}&lt;/strong&gt;&lt;span class=&quot;dlo-muted dlo-small&quot;&gt;${layout.groups}&lt;/span&gt;`;
        hostShard.className = `dlo-node transfer${currentStep === 0 ? &quot; ddr&quot; : &quot;&quot;}`;
        hostShard.innerHTML = `&lt;strong&gt;${stage.shard}&lt;/strong&gt;&lt;span class=&quot;dlo-muted dlo-small&quot;&gt;${layout.concurrency}&lt;/span&gt;`;
        ranks.innerHTML = rankCards(layout, currentStep);
        gpu.innerHTML = `&lt;strong&gt;${stage.gpu}&lt;/strong&gt;&lt;span class=&quot;dlo-muted dlo-small&quot;&gt;compute stream&lt;/span&gt;`;
        nextSlot.innerHTML = `&lt;strong&gt;${stage.next || &quot;Slots reserved for the next transition&quot;}&lt;/strong&gt;&lt;span class=&quot;dlo-muted dlo-small&quot;&gt;slot 0 ↔ slot 1&lt;/span&gt;`;
        note.textContent = stage.note;
        timeline.innerHTML = stages.map((_, index) =&gt; `&lt;div class=&quot;dlo-tick${index === currentStep ? &quot; active&quot; : &quot;&quot;}&quot;&gt;&lt;/div&gt;`).join(&quot;&quot;);
        previousButton.disabled = currentStep === 0;
        nextButton.disabled = currentStep === stages.length - 1;
      }

      function stop() {
        if (timer !== null) {
          window.clearInterval(timer);
          timer = null;
        }
        playButton.textContent = &quot;Play&quot;;
        playButton.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
      }

      function advance() {
        if (currentStep &gt;= stages.length - 1) {
          stop();
          return;
        }
        currentStep += 1;
        render();
      }

      previousButton.addEventListener(&quot;click&quot;, () =&gt; { stop(); currentStep = Math.max(0, currentStep - 1); render(); });
      nextButton.addEventListener(&quot;click&quot;, () =&gt; { stop(); currentStep = Math.min(stages.length - 1, currentStep + 1); render(); });
      configSelect.addEventListener(&quot;change&quot;, render);
      playButton.addEventListener(&quot;click&quot;, () =&gt; {
        if (timer !== null) {
          stop();
          return;
        }
        if (currentStep &gt;= stages.length - 1) currentStep = 0;
        playButton.textContent = &quot;Pause&quot;;
        playButton.setAttribute(&quot;aria-pressed&quot;, &quot;true&quot;);
        timer = window.setInterval(advance, 1500);
        render();
      });

      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
