<header class="site-header">

  <div class="wrapper header-inner">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">
      <span class="wordmark">vLLM-Omni</span>
      <span class="wordmark-sub" data-i18n="wordmark-blog" data-i18n-zh="博客">Blog</span>
    </a>

    <nav class="site-nav" aria-label="Main navigation">
      <div class="trigger">
        <a class="page-link{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}" data-i18n="nav-blog" data-i18n-zh="博客">Blog</a>
        {%- assign about_page = site.pages | where: "name", "about.md" | first -%}
        {%- if about_page -%}
        <a class="page-link{% if page.url == about_page.url %} active{% endif %}" href="{{ about_page.url | relative_url }}" data-i18n="nav-about" data-i18n-zh="关于">About</a>
        {%- endif -%}
        {%- assign tags_page = site.pages | where: "name", "tags.md" | first -%}
        {%- if tags_page -%}
        <a class="page-link{% if page.url == tags_page.url %} active{% endif %}" href="{{ tags_page.url | relative_url }}" data-i18n="nav-tags" data-i18n-zh="标签">Tags</a>
        {%- endif -%}
        <a class="page-link" href="https://docs.vllm.ai/projects/vllm-omni/en/latest/" rel="noopener">Docs</a>
        <a class="page-link" href="https://github.com/vllm-project/vllm-omni" rel="noopener">GitHub</a>
      </div>
    </nav>

    <div class="header-controls">
      <button class="icon-button" type="button" data-search-toggle aria-label="Search (Ctrl+J)" title="Search (Ctrl+J)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
      <button class="icon-button" type="button" data-theme-toggle aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </div>
</header>
