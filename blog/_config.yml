# vLLM-Omni Blog — self-contained Jekyll site.
#
# Mirrors the stack of https://github.com/vllm-project/vllm-project.github.io
# (vllm.ai/blog): Jekyll + Minima remote theme (pinned to the same commit),
# GitHub-Pages-allowlisted plugins only. Kept in its own directory so the whole
# blog/ tree can move to a dedicated repo later without restructuring.

title: vLLM-Omni Blog
description: >-
  Deep dives into important vLLM-Omni PRs, features, and model support —
  what changed, how it works, and the measured impact.

url: "https://hsliuustc0106.github.io"
baseurl: "/vllm-omni-cookbook"

remote_theme: jekyll/minima@5ce4006d175e6e5278bb63a0aad1a85e3bf2370b

minima:
  skin: auto
  social_links:
    - title: vLLM-Omni on GitHub
      icon: github
      url: "https://github.com/vllm-project/vllm-omni"

author:
  name: "© vLLM-Omni contributors"

# Canonical blog feature taxonomy, aligned with vLLM-Omni docs
# (docs/design/feature/ in vllm-project/vllm-omni). One `feature: <slug>` per
# post; the home sidebar filters by it and links each entry to its design doc.
# Keep slugs identical to the docs file names where one exists. `color` drives
# the generated per-feature cover art (blog/_includes/feature-cover.html).
features:
  - slug: pipeline
    label: Pipeline architecture
    label_zh: 流水线架构
    color: "#0f766e"
  - slug: quantization
    label: Quantization
    label_zh: 量化
    docs: quantization.md
    color: "#7c3aed"
  - slug: offloader
    label: Offloading
    label_zh: 卸载
    docs: offloader/
    color: "#0891b2"
  - slug: async_chunk
    label: Async chunking
    label_zh: 异步分块
    docs: async_chunk.md
    color: "#16a34a"
  - slug: disaggregated_inference
    label: Disaggregation
    label_zh: 分离推理
    docs: disaggregated_inference.md
    color: "#ea580c"
  - slug: realtime_ar_diffusion
    label: Realtime AR diffusion
    label_zh: 实时 AR 扩散
    docs: realtime_ar_diffusion.md
    color: "#db2777"
  - slug: parallelism
    label: Parallelism
    label_zh: 并行
    docs: tensor_parallel.md
    color: "#2563eb"
  - slug: continuous_batching
    label: Continuous batching
    label_zh: 连续批处理
    docs: diffusion_continuous_batching.md
    color: "#ca8a04"
  - slug: caching
    label: Caching & speedups
    label_zh: 缓存与加速
    docs: cache_dit.md
    color: "#dc2626"
  - slug: connectors
    label: Omni connectors
    label_zh: Omni 连接器
    docs: omni_connectors/
    color: "#0d9488"
  - slug: kernels
    label: Kernels & attention
    label_zh: 内核与注意力
    docs: attention_backend_selection.md
    color: "#4f46e5"
  - slug: lora
    label: LoRA adapters
    label_zh: LoRA 适配器
    docs: diffusion/lora.md   # user_guide path — no design doc yet
    color: "#c026d3"

header_pages:
  - about.md

# Show posts regardless of their front-matter date (same as vllm.ai).
future: true

# vllm.ai-style post URLs: /2026-08-16-my-post/ (categories stay out of the path).
permalink: /:year-:month-:day-:title/

# Keep the template and local dev files out of the published site.
exclude:
  - TEMPLATE.md

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-gfm-admonitions
  - jekyll-redirect-from

# Set when the site goes live.
# google_analytics: G-XXXXXXXXXX
